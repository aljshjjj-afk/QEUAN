<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090303">
<title>صيانة</title>
<meta property="og:title" content="صيانة">
<meta property="og:description" content="الموقع تحت الصيانة — نعود قريباً بصورة أفضل.">
<meta property="og:image" content="https://aljshjji-afk.github.io/QUEAN/maintenance.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--red:#ff202d;--red2:#8e0711;--bg:#090303;--muted:#a88f91}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:#fff}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;
background:radial-gradient(ellipse at 50% 42%,#30080d 0%,#160507 35%,#090303 75%)}
body:before{content:"";position:fixed;inset:-30%;pointer-events:none;background:
 repeating-linear-gradient(115deg,transparent 0 90px,#ff202d08 91px 92px,transparent 93px 180px);
 animation:scan 18s linear infinite}
@keyframes scan{to{transform:translate3d(5%,3%,0)}}
.embers{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.embers i{position:absolute;bottom:-15px;width:3px;height:3px;border-radius:50%;background:#ff3541;box-shadow:0 0 12px 3px #ff202d88;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) translateX(45px);opacity:0}}
.wrap{width:min(92vw,720px);position:relative;z-index:1;padding:22px}
.panel{position:relative;text-align:center;padding:clamp(30px,7vw,66px) clamp(20px,6vw,58px);border:1px solid #ff263544;border-radius:28px;
background:linear-gradient(145deg,#1b090bdc,#0b0506ed 65%);box-shadow:0 25px 100px #000b,0 0 55px #e509201c,inset 0 1px #ffffff0c;overflow:hidden}
.panel:before{content:"";position:absolute;inset:0 auto auto 12%;width:76%;height:1px;background:linear-gradient(90deg,transparent,#ff3348,transparent);box-shadow:0 0 18px #ff2635}
.maintenance-image{display:block;width:min(100%,430px);max-height:230px;object-fit:cover;margin:0 auto 25px;border:1px solid #ff394955;border-radius:16px;box-shadow:0 0 28px #ff202d25}
.eyebrow{font-size:11px;letter-spacing:4px;color:#ff6a73;font-weight:800;margin-bottom:20px}
.gear-stage{width:132px;height:132px;margin:0 auto 22px;display:grid;place-items:center;position:relative}
.gear-stage:before,.gear-stage:after{content:"";position:absolute;border:1px solid #ff273544;border-radius:50%;inset:0;animation:pulse 3s ease-out infinite}
.gear-stage:after{inset:12px;animation-delay:1.5s}
@keyframes pulse{0%{transform:scale(.8);opacity:.1}50%{opacity:.8}100%{transform:scale(1.18);opacity:0}}
.gear{width:82px;height:82px;filter:drop-shadow(0 0 14px #ff1c2d88);animation:spin 18s linear infinite}
.gear path{fill:url(#gearGrad);stroke:#ff6570;stroke-width:1.4}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(38px,9vw,66px);line-height:1.2;margin:0 0 12px;font-weight:900;letter-spacing:-2px;text-shadow:0 0 28px #ff172d55}
.sub{color:#d7bfc1;font-size:clamp(14px,3vw,17px);line-height:2;margin:0 auto;max-width:480px}
.status{display:inline-flex;align-items:center;gap:10px;margin:28px 0 25px;padding:9px 17px;border:1px solid #ff33434a;border-radius:999px;background:#ff1d2a12;color:#ff7a83;font-size:13px;font-weight:700}
.dot{width:8px;height:8px;background:#ff2938;border-radius:50%;box-shadow:0 0 13px #ff2938;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25;box-shadow:0 0 2px #ff2938}}
.progress-head{display:flex;justify-content:space-between;color:#b99b9e;font-size:12px;margin-bottom:10px}
.track{height:5px;border-radius:20px;background:#391116;overflow:hidden}
.track span{display:block;height:100%;width:68%;border-radius:20px;background:linear-gradient(90deg,#8e0711,#ff2638,#ff9298);box-shadow:0 0 16px #ff2638;animation:work 3s ease-in-out infinite alternate}
@keyframes work{from{width:35%}to{width:78%}}
.foot{margin-top:30px;color:#80696c;font-size:11px}
.foot b{color:#ff737c}
@media(max-width:420px){.panel{border-radius:22px}.gear-stage{width:112px;height:112px}.gear{width:72px;height:72px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="embers" id="embers" aria-hidden="true"></div>
<main class="wrap">
<section class="panel">
  <div class="eyebrow">SYSTEM MAINTENANCE</div>
  <img class="maintenance-image" src="https://aljshjji-afk.github.io/QUEAN/maintenance.jpg" alt="صورة الصيانة">
  <div class="gear-stage" aria-hidden="true">
    <svg class="gear" viewBox="0 0 100 100" role="img" aria-label="ترس ميكانيكي">
      <defs><linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5964"/><stop offset=".5" stop-color="#d20d20"/><stop offset="1" stop-color="#650611"/></linearGradient></defs>
      <path d="M43 5h14l3 10a36 36 0 0 1 8 3l8-6 10 10-6 8a36 36 0 0 1 3 8l10 3v14l-10 3a36 36 0 0 1-3 8l6 8-10 10-8-6a36 36 0 0 1-8 3l-3 10H43l-3-10a36 36 0 0 1-8-3l-8 6-10-10 6-8a36 36 0 0 1-3-8L7 57V43l10-3a36 36 0 0 1 3-8l-6-8 10-10 8 6a36 36 0 0 1 8-3z"/>
      <circle cx="50" cy="50" r="17" fill="#170609" stroke="#ff6570" stroke-width="3"/>
      <circle cx="50" cy="50" r="7" fill="#8e0711" stroke="#ff9298" stroke-width="2"/>
    </svg>
  </div>
  <h1>صيانة</h1>
  <p class="sub">الموقع صيانه قريباً مؤقتا يرجع احسن من اول.<br>الموقع متوقف مؤقتاً.</p>
  <div class="status"><span class="dot"></span> جاري تنفيذ أعمال الصيانة</div>
  <div class="progress-head"><span>حالة النظام</span><span>تحديثات جارية</span></div>
  <div class="track"><span></span></div>
  <div class="foot">نشكركم على صبركم وثقتكم <b>♥</b></div>
</section>
</main>
<script>
const embers=document.getElementById('embers');
for(let i=0;i<42;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.animationDuration=(6+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*15)+'s';p.style.opacity=Math.random();const s=1+Math.random()*2;p.style.width=s+'px';p.style.height=s+'px';embers.appendChild(p)}
let audio=null, ambientTimer=null, soundStarted=false;

function tone(freq=440,duration=.12,type='sine',volume=.018){
 if(!audio || audio.state!=='running')return;
 const osc=audio.createOscillator(),gain=audio.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(freq,audio.currentTime);
 gain.gain.setValueAtTime(.0001,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(volume,audio.currentTime+.04);
 gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);
 osc.connect(gain);gain.connect(audio.destination);
 osc.start();osc.stop(audio.currentTime+duration+.04);
}

async function startAmbientSound(){
 if(soundStarted)return;
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!audio)audio=new AudioCtx();
  if(audio.state==='suspended')await audio.resume();
  if(audio.state!=='running')return;
  soundStarted=true;

  // Soft cinematic electronic ambience, no external audio files required.
  const master=audio.createGain();
  master.gain.value=.22;
  master.connect(audio.destination);

  const drone=audio.createOscillator();
  const droneGain=audio.createGain();
  drone.type='sine';
  drone.frequency.value=55;
  droneGain.gain.value=.018;
  drone.connect(droneGain);
  droneGain.connect(master);
  drone.start();

  const pulse=()=>{
   if(!soundStarted || audio.state!=='running')return;
   const now=audio.currentTime;
   const osc=audio.createOscillator();
   const gain=audio.createGain();
   osc.type='triangle';
   osc.frequency.setValueAtTime(110,now);
   osc.frequency.exponentialRampToValueAtTime(82,now+.65);
   gain.gain.setValueAtTime(.0001,now);
   gain.gain.exponentialRampToValueAtTime(.025,now+.08);
   gain.gain.exponentialRampToValueAtTime(.0001,now+.8);
   osc.connect(gain);gain.connect(master);
   osc.start(now);osc.stop(now+.85);
  };
  pulse();
  ambientTimer=setInterval(pulse,4200);
 }catch(e){
  // Browser autoplay restrictions may prevent sound until the visitor interacts.
 }
}

// Attempt autoplay immediately. If the browser blocks it, start silently
// on the visitor's first tap, click, or key press—without showing a button.
startAmbientSound();
['pointerdown','touchstart','keydown','click'].forEach(eventName=>{
 document.addEventListener(eventName,()=>startAmbientSound(),{once:true,passive:true});
});
</script>
</body>
</html>
